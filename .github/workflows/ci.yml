name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, Clippy, Tests & Examples (CPU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Clippy (CPU-only)
        run: cargo clippy -p doc-photo-degrade --no-default-features --all-targets -- -D warnings

      - name: Check rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --no-default-features

      - name: Run CPU-only test suite
        run: cargo test -p doc-photo-degrade --no-default-features

      - name: Run workspace doctests
        run: cargo test --doc --workspace

      - name: Compile workspace examples
        run: cargo test --workspace --examples --no-run
